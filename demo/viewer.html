<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripwire trace viewer</title>
<!--
  Single static file. No build step, no framework, no network access.
  Open in a browser and drag a trace JSON (runs/*.json) onto the page.
  Traces contain attacker-written text, so every value is rendered with textContent, never innerHTML.
-->
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel-2: #1c2330; --border: #2a3240;
    --text: #e6edf3; --muted: #8b949e; --faint: #6e7681;
    --red: #ff6b61; --red-bg: rgba(248, 81, 73, .14); --red-line: rgba(248, 81, 73, .55);
    --blue: #6cb6ff; --blue-bg: rgba(88, 166, 255, .13); --blue-line: rgba(88, 166, 255, .5);
    --amber: #e3b341; --amber-bg: rgba(210, 153, 34, .14);
    --green: #56d364; --green-bg: rgba(63, 185, 80, .13);
    --purple: #d2a8ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
  button, label.button {
    font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  button:hover, label.button:hover { border-color: var(--muted); }
  button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }

  header.bar {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 10px 20px; background: rgba(13, 17, 23, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border);
  }
  header.bar h1 { font-size: 16px; margin: 0 12px 0 0; letter-spacing: .02em; }
  header.bar h1 span { color: var(--red); }
  header.bar .spacer { flex: 1; }
  header.bar .hint { color: var(--faint); font-size: 12px; }
  #file { display: none; }

  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  #empty {
    margin-top: 12vh; padding: 56px 24px; text-align: center; border: 2px dashed var(--border); border-radius: 14px; color: var(--muted);
  }
  #empty strong { display: block; color: var(--text); font-size: 20px; margin-bottom: 6px; }
  #empty code { font-family: var(--mono); color: var(--text); }
  #drop-overlay {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(13, 17, 23, .85); border: 3px dashed var(--blue); font-size: 22px; color: var(--blue);
  }
  body.dragging #drop-overlay { display: flex; }
  .error { margin: 16px 0; padding: 12px 14px; border: 1px solid var(--red-line); background: var(--red-bg); border-radius: 8px; color: var(--red); }

  /* summary */
  .summary { display: grid; gap: 14px; margin-bottom: 22px; }
  .title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; }
  .title-row h2 { margin: 0; font-size: 24px; font-family: var(--mono); font-weight: 600; word-break: break-all; }
  .title-row .run-id { color: var(--faint); font-family: var(--mono); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px;
          border: 1px solid var(--border); background: var(--panel); white-space: nowrap; }
  .chip.red { color: var(--red); background: var(--red-bg); border-color: var(--red-line); font-weight: 600; }
  .chip.green { color: var(--green); background: var(--green-bg); border-color: rgba(63, 185, 80, .45); }
  .chip.amber { color: var(--amber); background: var(--amber-bg); border-color: rgba(210, 153, 34, .45); }
  .chip.blue { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-line); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 10px; }
  .toolbar .count { color: var(--muted); font-size: 13px; margin-left: auto; font-variant-numeric: tabular-nums; }

  /* timeline */
  ol.timeline { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; }
  ol.timeline::before { content: ""; position: absolute; left: 11px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
  li.event { position: relative; margin: 0 0 10px; animation: rise .28s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  li.event::before {
    content: ""; position: absolute; left: -25px; top: 15px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--faint);
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .seq { font-family: var(--mono); color: var(--faint); font-size: 12px; min-width: 2.2em; }
  .kind { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
  .tool { font-family: var(--mono); font-size: 14px; }
  .ts { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .body { margin-top: 6px; }
  .line { color: var(--text); }
  .muted { color: var(--muted); }
  details.raw { margin-top: 6px; }
  details.raw summary { cursor: pointer; color: var(--faint); font-size: 12px; }
  pre { margin: 6px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
        font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; }

  /* categories */
  li.cat-denial::before { background: var(--red); border-color: var(--red); box-shadow: 0 0 0 4px var(--red-bg); }
  li.cat-denial .card { border-color: var(--red-line); background: linear-gradient(90deg, var(--red-bg), var(--panel) 70%); }
  li.cat-denial .kind { background: var(--red); color: #1a0806; }
  li.cat-cap::before { background: var(--blue); border-color: var(--blue); }
  li.cat-cap .card { border-color: var(--blue-line); background: linear-gradient(90deg, var(--blue-bg), var(--panel) 70%); }
  li.cat-cap .kind { background: var(--blue); color: #04121f; }
  li.cat-approval::before { border-color: var(--amber); background: var(--amber); }
  li.cat-approval .card { border-color: rgba(210, 153, 34, .5); }
  li.cat-approval .kind { background: var(--amber); color: #1d1402; }
  li.cat-warn::before { border-color: var(--amber); }
  li.cat-warn .kind { color: var(--amber); }
  li.cat-agent::before { border-color: var(--purple); }
  li.cat-agent .kind { color: var(--purple); }
  li.cat-run::before { border-color: var(--text); background: var(--text); }
  li.cat-run .kind { color: var(--text); }
  li.cat-io .card { background: transparent; }

  /* values */
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin-top: 4px; }
  .kv .k { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .kv .v { min-width: 0; }
  .val { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .taint { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font: 600 11px/1.6 var(--sans);
           vertical-align: 1px; white-space: nowrap; }
  .taint.untrusted { color: var(--amber); background: var(--amber-bg); border: 1px solid rgba(210, 153, 34, .45); }
  .taint.trusted { color: var(--green); background: var(--green-bg); border: 1px solid rgba(63, 185, 80, .4); }
  .rope-part { border-bottom: 2px solid transparent; }
  .rope-part.untrusted { border-bottom-color: rgba(210, 153, 34, .6); }
  .rope-part.trusted { border-bottom-color: rgba(63, 185, 80, .45); }
  .reason { font-weight: 600; }
  li.cat-denial .reason { color: var(--red); }
  .steps { margin: 4px 0 0; padding-left: 18px; }
  .steps li { font-family: var(--mono); font-size: 13px; }

  .endstate { margin-top: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
  .endstate section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .endstate h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .endstate .item { padding: 8px 0; border-top: 1px solid var(--border); }
  .endstate .item:first-of-type { border-top: 0; }

  @media (max-width: 640px) {
    header.bar .hint { display: none; }
    .kv { grid-template-columns: 1fr; }
    .ts { margin-left: 0; }
  }
</style>
</head>
<body>
<header class="bar">
  <h1>Trip<span>wire</span> trace viewer</h1>
  <label class="button" for="file">Open trace…</label>
  <input id="file" type="file" accept=".json,application/json">
  <button id="replay" type="button" disabled>Replay</button>
  <button id="showall" type="button" disabled>Show all</button>
  <span class="spacer"></span>
  <span class="hint">space / → next · ← back · R replay · Esc show all</span>
</header>
<div id="drop-overlay">Drop trace JSON</div>

<main>
  <section id="examples" class="toolbar">
    <span class="muted">Load example</span>
    <button type="button" data-trace="live_run.json">Live run (GitHub → Linear + Slack)</button>
    <button type="button" data-trace="atk_16.json">Attack: canary exfiltration blocked</button>
    <button type="button" data-trace="atk_01.json">Attack: direct injection blocked</button>
  </section>
  <div id="error" class="error" hidden></div>
  <div id="empty">
    <strong>Drop a trace JSON anywhere on this page</strong>
    Any file from <code>runs/</code>, written by <code>python -m evals.runner</code> or <code>python run.py</code>.
  </div>
  <div id="view" hidden>
    <div id="summary" class="summary"></div>
    <div class="toolbar" id="filters"></div>
    <ol id="timeline" class="timeline"></ol>
    <div id="endstate" class="endstate"></div>
  </div>
</main>

<script>
"use strict";

const DENIALS = new Set(["cap_denied", "taint_denied", "egress_denied", "canary_hit"]);
const FILTERS = [
  ["all", "All"], ["denial", "Denials"], ["cap", "Capabilities"], ["io", "Tool calls"], ["agent", "Extract & plan"],
];

const state = { trace: null, record: null, filter: "all", shown: Infinity, timer: null };

// ---------- DOM helpers (text only, never HTML) ----------
function el(tag, className, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const $ = (id) => document.getElementById(id);

function category(kind) {
  if (DENIALS.has(kind)) return "denial";
  if (kind === "cap_mint") return "cap";
  if (kind === "approval_required") return "approval";
  if (kind === "error" || kind === "abstain") return "warn";
  if (kind === "run_start" || kind === "run_end") return "run";
  if (kind === "extract" || kind === "plan") return "agent";
  return "io";
}

// ---------- values ----------
const isTainted = (v) => v !== null && typeof v === "object" && !Array.isArray(v) && "tainted" in v && "origin" in v && "value" in v;

function truncate(text, max = 600) {
  const s = String(text);
  return s.length > max ? s.slice(0, max) + ` …(+${s.length - max} chars)` : s;
}

function taintTag(trust, origin) {
  const tag = el("span", `taint ${trust}`, trust);
  tag.title = `origin: ${origin}`;
  return tag;
}

function renderValue(value) {
  if (isTainted(value)) {
    const inner = value.value;
    // A rope: composite text whose parts keep their own trust and origin.
    if (Array.isArray(inner) && inner.length && inner.every(isTainted)) {
      const wrap = el("span", "val");
      for (const part of inner) {
        const span = el("span", `rope-part ${part.tainted}`, truncate(part.value, 400));
        span.title = `${part.tainted} · origin: ${part.origin}`;
        wrap.append(span);
      }
      return el("span", null, wrap, taintTag(value.tainted, value.origin));
    }
    return el("span", null, renderValue(inner), taintTag(value.tainted, value.origin));
  }
  if (value !== null && typeof value === "object") {
    if (Array.isArray(value) && value.every((v) => v === null || typeof v !== "object")) {
      return el("span", "val", truncate(JSON.stringify(value)));
    }
    return kv(value);
  }
  return el("span", "val", truncate(value === null ? "null" : value));
}

function kv(obj, keys) {
  const grid = el("div", "kv");
  for (const key of keys || Object.keys(obj)) {
    if (!(key in obj)) continue;
    grid.append(el("span", "k", key), el("span", "v", renderValue(obj[key])));
  }
  return grid;
}

function scopeText(scope) {
  const entries = Object.entries(scope || {});
  return entries.length ? entries.map(([k, v]) => `${k}=${v}`).join(", ") : "(no scoped args)";
}

// ---------- per-kind bodies ----------
function bodyFor(e) {
  const d = e.detail || {};
  switch (e.kind) {
    case "run_start":
      return el("div", "line", `Issue #${d.issue_number} · approval policy `, el("strong", null, d.approval_policy || "none"));
    case "cap_mint":
      return el("div", null,
        el("div", "line", "Capability ", el("span", "val", String(d.cap_id || "").slice(0, 8)),
          " scoped to ", el("span", "val", scopeText(d.scope))),
        d.step_id && d.step_id !== "read"
          ? el("div", "muted", `step ${d.step_id} · minted from the plan before substitution · refs ${JSON.stringify(d.arg_refs || {})}`)
          : el("div", "muted", "read step"));
    case "tool_call":
      return el("div", null, kv(d.args || {}), el("div", "muted", `cap ${String(d.cap_id || "").slice(0, 8)}`));
    case "tool_result":
      return renderValue(d.result);
    case "extract": {
      const fields = d.fields || {};
      return el("div", null, kv(fields, ["is_bug", "severity", "area", "confidence", "summary"]),
        el("div", "muted", `quarantined extractor · ${d.model || ""} · attempts ${d.attempts ?? "?"}${d.fallback ? " · FALLBACK" : ""}`));
    }
    case "plan": {
      if (d.abstain_reason) return el("div", "line", "Abstain: ", el("span", "reason", d.abstain_reason));
      const list = el("ol", "steps");
      for (const s of d.steps || []) {
        const refs = Object.entries(s.arg_refs || {}).map(([k, v]) => `${k}=${v}`).join(", ");
        list.append(el("li", null, `${s.tool}(${refs})`, s.reversible ? "" : "  · irreversible"));
      }
      const rejected = (d.rejected_steps || []).length;
      return el("div", null, list,
        el("div", "muted", `planner sees typed fields only · ${d.model || ""}${rejected ? ` · ${rejected} step(s) rejected` : ""}`));
    }
    case "approval_required":
      return el("div", null, el("div", "reason", d.reason),
        el("div", "muted", `untrusted args: ${(d.untrusted_args || []).join(", ") || "-"} · policy ${d.policy || "?"}`));
    case "cap_denied": case "taint_denied": case "egress_denied": case "canary_hit":
      return el("div", null, el("div", "reason", d.reason || e.kind),
        d.origin ? el("div", "line", "secret came from ", el("span", "val", d.origin)) : null,
        d.untrusted_args ? el("div", "muted", `untrusted args: ${d.untrusted_args.join(", ")}`) : null);
    case "abstain":
    case "error":
      return el("div", "reason", d.reason || "");
    case "run_end":
      return el("div", "line",
        `completed=${d.completed} · halted=${d.halted} · steps succeeded ${d.steps_succeeded} · tool calls ${d.tool_calls}` +
        ` · tokens ${(d.tokens?.input_tokens || 0) + (d.tokens?.output_tokens || 0)} · ${d.wall_clock_s}s`);
    default:
      return kv(d);
  }
}

function eventNode(e, t0) {
  const cat = category(e.kind);
  const head = el("div", "card-head",
    el("span", "seq", `#${e.seq}`),
    el("span", "kind", e.kind),
    e.tool ? el("span", "tool", e.tool) : null,
    el("span", "ts", `+${Math.max(0, (e.ts - t0)).toFixed(2)}s`));
  const raw = el("details", "raw", el("summary", null, "raw event"), el("pre", null, JSON.stringify(e, null, 2)));
  const li = el("li", `event cat-${cat}`, el("div", "card", head, el("div", "body", bodyFor(e)), raw));
  li.dataset.cat = cat;
  return li;
}

// ---------- summary / end state ----------
function stat(label, value) {
  return el("div", "stat", el("div", "label", label), el("div", "value", value));
}

function renderSummary(trace, record) {
  const events = trace.events || [];
  const end = [...events].reverse().find((e) => e.kind === "run_end")?.detail || {};
  const snap = trace.end_state || {};
  const linear = snap.linear || {}, slack = snap.slack || {};
  const denials = trace.denials || [];

  const chips = el("div", "chips",
    el("span", `chip ${trace.completed ? "green" : "amber"}`, trace.completed ? "completed" : "not completed"),
    end.halted ? el("span", "chip red", "run halted") : null,
    ...(denials.length ? denials.map((d) => el("span", "chip red", d)) : [el("span", "chip", "no denials")]),
    record ? el("span", `chip ${record.safe ? "green" : "red"}`, record.safe ? "safe" : "UNSAFE") : null,
    record ? el("span", `chip ${record.passed ? "green" : "amber"}`, record.passed ? "passed" : "expectation mismatch") : null,
    record ? el("span", "chip blue", `${record.family} · ${record.policy}`) : null);

  const tokens = (end.tokens?.input_tokens || 0) + (end.tokens?.output_tokens || 0);
  const summary = $("summary");
  summary.replaceChildren(
    el("div", "title-row", el("h2", null, trace.scenario_id || "trace"), el("span", "run-id", trace.run_id || "")),
    chips,
    el("div", "stats",
      stat("Linear tickets created", (linear.created || []).length),
      stat("Linear comments", (linear.comments || []).length),
      stat("Slack messages", (slack.messages || []).length),
      stat("Tool calls", end.tool_calls ?? events.filter((e) => e.kind === "tool_call").length),
      stat("Tokens", tokens),
      stat("Wall clock", end.wall_clock_s !== undefined ? `${end.wall_clock_s}s` : "-")));
}

function renderEndState(trace) {
  const snap = trace.end_state || {};
  const linear = snap.linear || {}, slack = snap.slack || {};
  const created = new Set(linear.created || []);

  const lin = el("section", null, el("h3", null, "Linear · effects of this run"));
  for (const issue of (linear.issues || []).filter((i) => created.has(i.id))) {
    lin.append(el("div", "item", el("div", "val", `created ${issue.id}`), el("div", null, truncate(issue.title, 300))));
  }
  for (const c of linear.comments || []) {
    lin.append(el("div", "item", el("div", "val", `comment on ${c.issue_id}`), el("div", "val", truncate(c.body, 600))));
  }
  for (const id of linear.closed || []) lin.append(el("div", "item reason", `closed ${id}`));
  if (lin.childElementCount === 1) lin.append(el("div", "muted", "no Linear writes"));

  const sl = el("section", null, el("h3", null, "Slack · messages sent"));
  for (const m of slack.messages || []) {
    sl.append(el("div", "item", el("div", "val", m.channel), el("div", null, truncate(m.text, 600))));
  }
  if (sl.childElementCount === 1) sl.append(el("div", "muted", "no Slack messages"));

  $("endstate").replaceChildren(lin, sl);
}

// ---------- timeline / filters / replay ----------
function renderFilters() {
  const bar = $("filters");
  bar.replaceChildren();
  for (const [key, label] of FILTERS) {
    const btn = el("button", null, label);
    btn.type = "button";
    btn.setAttribute("aria-pressed", String(state.filter === key));
    btn.addEventListener("click", () => { state.filter = key; renderFilters(); renderTimeline(); });
    bar.append(btn);
  }
  bar.append(el("span", "count", ""));
}

function renderTimeline() {
  const events = state.trace.events || [];
  const t0 = events.length ? events[0].ts : 0;
  const visible = events.slice(0, Math.min(state.shown, events.length))
    .filter((e) => state.filter === "all" || category(e.kind) === state.filter);
  $("timeline").replaceChildren(...visible.map((e) => eventNode(e, t0)));
  const shown = Math.min(state.shown, events.length);
  $("filters").querySelector(".count").textContent =
    `${shown < events.length ? `${shown} of ${events.length} events revealed` : `${events.length} events`}`;
}

function step(delta) {
  if (!state.trace) return;
  stopTimer();
  const total = state.trace.events.length;
  const current = Math.min(state.shown, total);
  state.shown = Math.max(0, Math.min(total, current + delta));
  renderTimeline();
  const last = $("timeline").lastElementChild;
  if (last && delta > 0) last.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function stopTimer() { if (state.timer) { clearInterval(state.timer); state.timer = null; } }

function replay() {
  if (!state.trace) return;
  stopTimer();
  state.filter = "all";
  renderFilters();
  state.shown = 0;
  renderTimeline();
  window.scrollTo({ top: 0 });
  state.timer = setInterval(() => {
    if (state.shown >= state.trace.events.length) return stopTimer();
    state.shown += 1;
    renderTimeline();
    const last = $("timeline").lastElementChild;
    if (last) last.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, 650);
}

function showAll() { if (!state.trace) return; stopTimer(); state.shown = Infinity; renderTimeline(); }

// ---------- loading ----------
function normalise(data) {
  if (data && data.result && Array.isArray(data.result.events)) return { trace: data.result, record: data.record || null };
  if (data && Array.isArray(data.events)) return { trace: data, record: null };
  throw new Error("Not a Tripwire trace: expected {events: [...]} or {record, result: {events: [...]}}.");
}

function showError(message) {
  const box = $("error");
  box.textContent = message;
  box.hidden = !message;
}

function loadTrace(data) {
  const { trace, record } = normalise(data);
  stopTimer();
  Object.assign(state, { trace, record, filter: "all", shown: Infinity });
  showError("");
  $("empty").hidden = true;
  $("view").hidden = false;
  $("replay").disabled = false;
  $("showall").disabled = false;
  renderSummary(trace, record);
  renderFilters();
  renderTimeline();
  renderEndState(trace);
  document.title = `${trace.scenario_id || "trace"} · Tripwire`;
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { loadTrace(JSON.parse(reader.result)); }
    catch (err) { showError(`${file.name}: ${err.message}`); }
  };
  reader.onerror = () => showError(`${file.name}: could not read file`);
  reader.readAsText(file);
}

window.addEventListener("dragover", (ev) => { ev.preventDefault(); document.body.classList.add("dragging"); });
window.addEventListener("dragleave", (ev) => { if (ev.relatedTarget === null) document.body.classList.remove("dragging"); });
window.addEventListener("drop", (ev) => {
  ev.preventDefault();
  document.body.classList.remove("dragging");
  loadFile(ev.dataTransfer?.files?.[0]);
});
$("file").addEventListener("change", (ev) => { loadFile(ev.target.files[0]); ev.target.value = ""; });
$("replay").addEventListener("click", replay);
$("showall").addEventListener("click", showAll);
window.addEventListener("keydown", (ev) => {
  if (!state.trace || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === " " || ev.key === "ArrowRight") { ev.preventDefault(); step(+1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); step(-1); }
  else if (ev.key === "r" || ev.key === "R") replay();
  else if (ev.key === "Escape") showAll();
});

async function loadExample(button) {
  const file = button.dataset.trace;
  try {
    const resp = await fetch(`./traces/${file}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    loadTrace(await resp.json());
  } catch (err) {
    showError(`${button.textContent}: could not load ./traces/${file} (${err.message}). ` +
      "Examples need the page served over http(s), e.g. GitHub Pages; drag-and-drop works anywhere.");
  }
}
document.querySelectorAll("#examples button[data-trace]").forEach((b) => b.addEventListener("click", () => loadExample(b)));

window.tripwireLoadTrace = loadTrace; // for scripted checks and pasting a trace from devtools
</script>
</body>
</html>
